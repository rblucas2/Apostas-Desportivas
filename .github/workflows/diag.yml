name: diag
on:
  push:
    branches: [claude/stoic-hopper-1p6hqs]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        env:
          K: ${{ secrets.ODDS_API_KEY }}
        run: |
          curl -s -D /tmp/h "https://api.the-odds-api.com/v4/sports/soccer_italy_serie_a/odds?apiKey=$K&regions=eu&markets=h2h&oddsFormat=decimal" -o /tmp/o
          grep -i x-requests /tmp/h
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/o'))
          print(type(d).__name__, len(d))
          bk=set()
          for e in d:
              for b in e.get('bookmakers',[]): bk.add((b['key'],b['title']))
          print(sorted(bk))
          for e in d[:6]: print(e['commence_time'], e['home_team'],'vs',e['away_team'], [b['key'] for b in e['bookmakers']][:30])
          PY
