name: diag
on:
  push:
    branches: [claude/stoic-hopper-1p6hqs]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 -m unittest discover -s scanner/tests 2>&1 | tail -1
          cp -r site /tmp/site
          python3 scanner/scan.py --odds nao --out /tmp/site/data/jogos.json 2>&1 | grep -v "^    aviso"
          python3 - <<'PY'
          import sys, json, datetime as dt, os
          sys.path.insert(0, "scanner"); import scan
          d = json.load(open("/tmp/site/data/jogos.json"))
          cfg = json.load(open("scanner/config.json"))
          sports = {l["espn"]: l["odds"] for l in cfg["ligas"] if l.get("odds")}
          now = dt.datetime.now(dt.timezone.utc)
          rem = scan.odds_credits(os.environ["ODDS_API_KEY"])
          st = scan.update_budget_state({}, rem, now.date(), None)
          print("ORCAMENTO", {k: st[k] for k in ("restantes", "dias_ate_renovacao", "orcamento_hoje", "disponivel_agora")})
          for g in d["jogos"]: g.pop("cotas", None)  # pior caso: nenhum jogo com cota
          fila = scan.leagues_needing_odds(d["jogos"], sports, {}, now)
          print("FILA (pior caso)", len(fila), fila)
          from collections import Counter
          print("JOGOS POR LIGA", Counter(g["liga_id"] for g in d["jogos"]))
          for g in d["jogos"]:
              if g["liga_id"].startswith(("uefa", "ned.2", "sco.2")):
                  print(" ", g["data"][:16], g["liga"], "|", g["casa"]["nome"], g["casa"]["posicao"], "vs", g["fora"]["nome"], g["fora"]["posicao"], [c["texto"] for c in g["criterios"]])
          h = json.load(open("/tmp/site/data/historico.json"))
          print("HIST", len(h["jogos"]))
          PY
