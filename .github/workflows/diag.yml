name: diag
on:
  push:
    branches: [claude/stoic-hopper-1p6hqs]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          time python3 scanner/scan.py --odds nao --out /tmp/j.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/j.json'))
          for l in d['ligas']: print(l)
          print('JOGOS', len(d['jogos']))
          for g in d['jogos'][:40]:
              print(g['data'], g['liga'], '|', g['casa']['nome'], g['casa']['posicao'], g['casa']['forma'], 'vs', g['fora']['nome'], g['fora']['posicao'], g['fora']['forma'], '|', [c['texto'] for c in g['criterios']])
          PY
