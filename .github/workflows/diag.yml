name: diag
on:
  push:
    branches: [claude/stoic-hopper-1p6hqs]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          cp -r site /tmp/site
          python3 scanner/scan.py --odds nao --ligas bra.1,arg.1 --out /tmp/site/data/jogos.json 2>&1 | grep -v "^    aviso"
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "scanner"); import scan
          d = json.load(open("/tmp/site/data/jogos.json"))
          for g in d["jogos"]:
              print(g["data"][:16], g["liga"], "|", g["casa"]["nome"], g["casa"]["posicao"], g["casa"]["forma"], "vs", g["fora"]["nome"], g["fora"]["posicao"], g["fora"]["forma"], [c["texto"] for c in g["criterios"]])
          import urllib.request
          st = json.load(urllib.request.urlopen("https://site.api.espn.com/apis/v2/sports/soccer/arg.1/standings"))
          print("ARG grupos:", [(c.get("name"), len(c["standings"]["entries"])) for c in st.get("children", [])])
          PY
