name: diag
on:
  push:
    branches: [claude/stoic-hopper-1p6hqs]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          python3 - <<'PY'
          import json, urllib.request, re
          def get(u):
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "x"}), timeout=25))
              except Exception as e:
                  return {"_erro": str(e)}
          d = get("https://site.api.espn.com/apis/site/v2/leagues/dropdown?sport=soccer&limit=1000")
          ls = d.get("leagues") or []
          print("ligas na lista:", len(ls), d.get("_erro", ""))
          pat = re.compile(r"portug|liga 3|3\. liga|german|poland|polish|ekstra|croat|hnl|serbia|czech|romania|finland|finnish|swiss|switz|ireland|irish|cyprus|cypriot", re.I)
          cands = []
          for l in ls:
              nome = f"{l.get('name','')} {l.get('abbreviation','')}"
              if pat.search(nome):
                  print("  ", l.get("slug"), "|", l.get("name"))
                  cands.append(l.get("slug"))
          for slug in cands:
              t = get(f"https://site.api.espn.com/apis/site/v2/sports/soccer/{slug}/teams")
              teams = (((t.get("sports") or [{}])[0].get("leagues") or [{}])[0].get("teams") or [])
              info = ""
              if teams:
                  tid = teams[0]["team"]["id"]
                  s = get(f"https://site.api.espn.com/apis/site/v2/sports/soccer/{slug}/teams/{tid}/schedule")
                  evs = s.get("events") or []
                  done = [e for e in evs if (((e.get("competitions") or [{}])[0].get("status") or {}).get("type") or {}).get("completed")]
                  info = f"época={(s.get('season') or {}).get('displayName')} eventos={len(evs)} terminados={len(done)} ultimo={(done[-1]['date'] if done else '-')}"
              st = get(f"https://site.api.espn.com/apis/v2/sports/soccer/{slug}/standings")
              n = sum(len((c.get('standings') or {}).get('entries') or []) for c in st.get('children') or [])
              print(f"{slug:24} equipas={len(teams):3} classif={n:3} {info}")
          PY
